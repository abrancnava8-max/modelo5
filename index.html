<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I LOVE YOU ❤️</title>
    <style>
        /* Quitamos los márgenes y hacemos que el fondo sea negro puro */
        body {
            margin: 0;
            padding: 0;
            background-color: rgb(0, 0, 0);
            overflow: hidden; /* Evita que salgan barras de desplazamiento */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <canvas id="lienzo"></canvas>

    <script>
        const canvas = document.getElementById('lienzo');
        const ctx = canvas.getContext('2d');

        let width, height;

        // Ajusta el lienzo al tamaño de la pantalla
        function redimensionar() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            width = canvas.width;
            height = canvas.height;
        }
        window.addEventListener('resize', redimensionar);
        redimensionar();

        // Colores en formato RGB
        const colores = [
            [255, 60, 90],   // ROJO
            [255, 105, 180], // ROSA
            [255, 255, 255]  // BLANCO
        ];

        class Particula {
            constructor(x, y) {
                // Posición con ligera variación
                this.x = x + (Math.random() * 8 - 4);
                this.y = y + (Math.random() * 8 - 4);

                // Velocidad
                this.vx = Math.random() * 1.2 - 0.6;
                this.vy = Math.random() * 1.2 - 0.6;

                // Tamaño entre 2 y 5
                this.tamano = Math.floor(Math.random() * 4) + 2;

                // Color aleatorio
                this.color = colores[Math.floor(Math.random() * colores.length)];

                // Vida entre 80 y 140
                this.vidaMax = Math.floor(Math.random() * 61) + 80;
                this.vida = this.vidaMax;
            }

            actualizar() {
                this.x += this.vx;
                this.y += this.vy;
                
                // Movimiento suave hacia arriba
                this.vy -= 0.003;
                this.vida -= 1;
            }

            dibujar(ctx) {
                // Calcular transparencia (alpha)
                let alpha = Math.max(0, Math.min(1, this.vida / this.vidaMax));
                
                ctx.fillStyle = `rgba(${this.color[0]}, ${this.color[1]}, ${this.color[2]}, ${alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.tamano, 0, Math.PI * 2);
                ctx.fill();
            }

            viva() {
                return this.vida > 0;
            }
        }

        // Generar los puntos del borde del corazón
        function generarCorazon(cx, cy) {
            let puntos = [];
            for (let i = 0; i < 360; i += 2) {
                let t = i * Math.PI / 180; // Convertir a radianes

                let x = 16 * Math.pow(Math.sin(t), 3);
                let y = -(
                    13 * Math.cos(t) 
                    - 5 * Math.cos(2 * t) 
                    - 2 * Math.cos(3 * t) 
                    - Math.cos(4 * t)
                );

                // Hacemos la escala un poco dinámica para que quepa en móviles
                let escala = Math.min(width, height) / 50; 

                puntos.push({ 
                    x: cx + x * escala, 
                    y: cy + y * escala 
                });
            }
            return puntos;
        }

        let particulas = [];

        function animar() {
            // Limpiar la pantalla en cada frame pintando un rectángulo negro
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, width, height);

            // Dibujar el texto
            ctx.fillStyle = "white";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            
            // Tamaño de fuente dinámico para que no se corte en móviles
            let tamanoFuente = Math.min(width * 0.08, 110);
            ctx.font = `bold ${tamanoFuente}px Arial`;
            ctx.fillText("I LOVE YOU", width / 2, height * 0.15);

            // Centro del corazón
            let centroX = width / 2;
            let centroY = height * 0.55;

            let puntosCorazon = generarCorazon(centroX, centroY);

            // Crear nuevas partículas
            for (let i = 0; i < 14; i++) {
                let punto = puntosCorazon[Math.floor(Math.random() * puntosCorazon.length)];
                particulas.push(new Particula(punto.x, punto.y));
            }

            // Actualizar y dibujar partículas vivas
            particulas = particulas.filter(p => {
                p.actualizar();
                if (p.viva()) {
                    p.dibujar(ctx);
                    return true;
                }
                return false;
            });

            // Llamar al siguiente frame
            requestAnimationFrame(animar);
        }

        // Iniciar la animación
        animar();
    </script>
</body>
</html>
